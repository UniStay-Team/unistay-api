openapi: 3.0.3
info:
  title: UniStay API
  version: 1.0.0
  description: Shared API for web and Flutter clients.
paths:
  /api/v1/applications/:
    get:
      operationId: v1_applications_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApplicationList'
          description: ''
    post:
      operationId: v1_applications_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApplicationCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApplicationCreateRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ''
  /api/v1/applications/{id}/:
    get:
      operationId: v1_applications_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ''
  /api/v1/applications/{id}/accept/:
    post:
      operationId: v1_applications_accept_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ''
  /api/v1/applications/{id}/cancel/:
    post:
      operationId: v1_applications_cancel_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ''
  /api/v1/applications/{id}/reject/:
    post:
      operationId: v1_applications_reject_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      tags:
      - v1
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/password-reset/:
    post:
      operationId: v1_auth_password_reset_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: v1_auth_password_reset_confirm_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResetConfirmRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/resend-verification/:
    post:
      operationId: v1_auth_resend_verification_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/v1/auth/verify-email/:
    post:
      operationId: v1_auth_verify_email_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/v1/listings/:
    get:
      operationId: v1_listings_list
      parameters:
      - in: query
        name: available
        schema:
          type: boolean
      - in: query
        name: city
        schema:
          type: string
      - in: query
        name: district
        schema:
          type: string
      - in: query
        name: max_price
        schema:
          type: number
          format: double
      - in: query
        name: min_price
        schema:
          type: number
          format: double
      - in: query
        name: ordering
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: university
        schema:
          type: string
      tags:
      - v1
      security:
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedListingList'
          description: ''
    post:
      operationId: v1_listings_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ListingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ListingRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
          description: ''
  /api/v1/listings/{id}/:
    get:
      operationId: v1_listings_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      security:
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
          description: ''
    patch:
      operationId: v1_listings_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedListingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedListingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedListingRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
          description: ''
    delete:
      operationId: v1_listings_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/listings/{id}/group/:
    get:
      operationId: v1_listings_group_list
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGroupMemberList'
          description: ''
  /api/v1/listings/{id}/photos/:
    post:
      operationId: v1_listings_photos_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhotoUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PhotoUploadRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photo'
          description: ''
  /api/v1/listings/mine/:
    get:
      operationId: v1_listings_mine_retrieve
      tags:
      - v1
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
          description: ''
  /api/v1/me/:
    get:
      operationId: v1_me_retrieve
      tags:
      - v1
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/me/profile/:
    get:
      operationId: v1_me_profile_retrieve
      tags:
      - v1
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
    patch:
      operationId: v1_me_profile_partial_update
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/v1/photos/{id}/:
    delete:
      operationId: v1_photos_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    Applicant:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        profile:
          allOf:
          - $ref: '#/components/schemas/Profile'
          readOnly: true
      required:
      - id
      - name
      - profile
    Application:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        listing_id:
          type: integer
          readOnly: true
        listing_title:
          type: string
          readOnly: true
        student:
          allOf:
          - $ref: '#/components/schemas/Applicant'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
          default: pending
        message:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
          readOnly: true
      required:
      - created_at
      - events
      - id
      - listing_id
      - listing_title
      - message
      - status
      - student
      - updated_at
    ApplicationCreateRequest:
      type: object
      properties:
        listing_id:
          type: integer
          minimum: 1
        message:
          type: string
          default: ''
          maxLength: 1000
      required:
      - listing_id
    ApplicationStatusEnum:
      enum:
      - pending
      - accepted
      - rejected
      - cancelled
      type: string
      description: |-
        * `pending` - Pending
        * `accepted` - Accepted
        * `rejected` - Rejected
        * `cancelled` - Cancelled
    BlankEnum:
      enum:
      - ''
    CleanlinessEnum:
      enum:
      - tidy
      - relaxed
      type: string
      description: |-
        * `tidy` - Tidy
        * `relaxed` - Relaxed
    EmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    Event:
      type: object
      properties:
        from_status:
          type: string
          maxLength: 12
        to_status:
          type: string
          maxLength: 12
        created_at:
          type: string
          format: date-time
          readOnly: true
        actor_id:
          type: integer
          readOnly: true
      required:
      - actor_id
      - created_at
      - to_status
    GroupMember:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        university:
          type: string
        bio:
          type: string
        schedule:
          type: string
        smoking:
          type: boolean
          nullable: true
        cleanliness:
          type: string
        compatibility:
          type: integer
          nullable: true
        matching_preferences:
          type: array
          items:
            type: string
        compared_preferences:
          type: integer
      required:
      - bio
      - cleanliness
      - compared_preferences
      - compatibility
      - id
      - matching_preferences
      - name
      - schedule
      - smoking
      - university
    Listing:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        owner:
          type: integer
          readOnly: true
        owner_name:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 160
        description:
          type: string
          maxLength: 5000
        city:
          type: string
          maxLength: 100
        district:
          type: string
          maxLength: 100
        address:
          type: string
          nullable: true
          description: Exact address; null in responses for guests and non-accepted
            students. Required non-null on creation.
          maxLength: 255
        university:
          type: string
          maxLength: 160
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        deposit:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        utilities_included:
          type: boolean
        capacity:
          type: integer
          maximum: 6
          minimum: 1
        move_in_date:
          type: string
          format: date
          nullable: true
        status:
          $ref: '#/components/schemas/ListingStatusEnum'
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
          readOnly: true
        occupied:
          type: integer
          readOnly: true
        available:
          type: integer
          readOnly: true
        group_ready:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - available
      - capacity
      - created_at
      - description
      - district
      - group_ready
      - id
      - occupied
      - owner
      - owner_name
      - photos
      - price
      - title
      - university
      - updated_at
    ListingRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          minLength: 1
          maxLength: 5000
        city:
          type: string
          minLength: 1
          maxLength: 100
        district:
          type: string
          minLength: 1
          maxLength: 100
        address:
          type: string
          nullable: true
          minLength: 1
          description: Exact address; null in responses for guests and non-accepted
            students. Required non-null on creation.
          maxLength: 255
        university:
          type: string
          minLength: 1
          maxLength: 160
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        deposit:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        utilities_included:
          type: boolean
        capacity:
          type: integer
          maximum: 6
          minimum: 1
        move_in_date:
          type: string
          format: date
          nullable: true
        status:
          $ref: '#/components/schemas/ListingStatusEnum'
      required:
      - address
      - capacity
      - description
      - district
      - price
      - title
      - university
    ListingStatusEnum:
      enum:
      - draft
      - published
      - archived
      type: string
      description: |-
        * `draft` - Draft
        * `published` - Published
        * `archived` - Archived
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
    Me:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        email_verified:
          type: boolean
          readOnly: true
        profile:
          allOf:
          - $ref: '#/components/schemas/Profile'
          readOnly: true
      required:
      - email
      - email_verified
      - id
      - name
      - profile
      - role
    Message:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    PaginatedApplicationList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Application'
    PaginatedGroupMemberList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/GroupMember'
    PaginatedListingList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Listing'
    PatchedListingRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          minLength: 1
          maxLength: 5000
        city:
          type: string
          minLength: 1
          maxLength: 100
        district:
          type: string
          minLength: 1
          maxLength: 100
        address:
          type: string
          nullable: true
          minLength: 1
          description: Exact address; null in responses for guests and non-accepted
            students. Required non-null on creation.
          maxLength: 255
        university:
          type: string
          minLength: 1
          maxLength: 160
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        deposit:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        utilities_included:
          type: boolean
        capacity:
          type: integer
          maximum: 6
          minimum: 1
        move_in_date:
          type: string
          format: date
          nullable: true
        status:
          $ref: '#/components/schemas/ListingStatusEnum'
    PatchedProfileRequest:
      type: object
      properties:
        university:
          type: string
          maxLength: 160
        bio:
          type: string
          maxLength: 1000
        schedule:
          oneOf:
          - $ref: '#/components/schemas/ScheduleEnum'
          - $ref: '#/components/schemas/BlankEnum'
        smoking:
          type: boolean
          nullable: true
        cleanliness:
          oneOf:
          - $ref: '#/components/schemas/CleanlinessEnum'
          - $ref: '#/components/schemas/BlankEnum'
        share_with_group:
          type: boolean
    Photo:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        image:
          type: string
          format: uri
          nullable: true
          readOnly: true
        caption:
          type: string
          maxLength: 160
      required:
      - id
      - image
    PhotoRequest:
      type: object
      properties:
        caption:
          type: string
          maxLength: 160
    PhotoUploadRequest:
      type: object
      properties:
        image:
          type: string
          format: binary
        caption:
          type: string
          maxLength: 160
      required:
      - image
    Profile:
      type: object
      properties:
        university:
          type: string
          maxLength: 160
        bio:
          type: string
          maxLength: 1000
        schedule:
          oneOf:
          - $ref: '#/components/schemas/ScheduleEnum'
          - $ref: '#/components/schemas/BlankEnum'
        smoking:
          type: boolean
          nullable: true
        cleanliness:
          oneOf:
          - $ref: '#/components/schemas/CleanlinessEnum'
          - $ref: '#/components/schemas/BlankEnum'
        share_with_group:
          type: boolean
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 10
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 120
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - email
      - name
      - password
      - role
    ResetConfirmRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
          maxLength: 128
        token:
          type: string
          minLength: 1
          maxLength: 256
        password:
          type: string
          writeOnly: true
          minLength: 10
          maxLength: 128
      required:
      - password
      - token
      - uid
    RoleEnum:
      enum:
      - student
      - landlord
      type: string
      description: |-
        * `student` - Student
        * `landlord` - Landlord
    ScheduleEnum:
      enum:
      - early
      - late
      type: string
      description: |-
        * `early` - Early
        * `late` - Late
    TokenResponse:
      type: object
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/Me'
      required:
      - expires_at
      - token
      - user
    VerifyRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 2048
      required:
      - token
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque token from auth/login, expires in 24 hours.
